name: SonarQube Cloud
on:
  push:
    branches: [ master ]
  pull_request:
    types: [ opened, synchronize, reopened ]

jobs:
  analyze:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install scanner
        run: dotnet tool install --global dotnet-sonarscanner
      - name: Analyze Calculator sample
        shell: pwsh
        working-directory: sonar-dotnet-core/src/test/resources/samples/csharp/Calculator
        run: |
          dotnet sonarscanner begin /k:"ahsan-aalleey_sonar-dotnet" /o:"ahsan-aalleey" /d:sonar.token="${{ secrets.SONAR_TOKEN }}" /d:sonar.host.url="https://sonarcloud.io" /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" /d:sonar.qualitygate.wait=true
          dotnet build Calculator.sln --no-incremental
          dotnet test Calculator.xUnit/Calculator.xUnit.csproj --no-build --collect:"XPlat Code Coverage;Format=opencover"
          dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"